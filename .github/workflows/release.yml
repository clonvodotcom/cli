# Publishes to npm when a version tag (v1.2.3) is pushed, with provenance: npm records that this workflow, from
# this repository and commit, built the package. Uses npm trusted publishing (OIDC), so no npm token is stored here.
# Set it up once on npmjs.com: package settings → Trusted publisher → GitHub Actions, repository clonvodotcom/cli,
# workflow release.yml.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      # A version already on npm (published by hand) is left alone, so re-running a tag never fails.
      - name: Publish unless this version is already on npm
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          if npm view "@clonvo/cli@$VERSION" version >/dev/null 2>&1; then
            echo "@clonvo/cli@$VERSION is already on npm; nothing to publish."
          else
            npm publish --provenance --access public
          fi
